# Configuração da máquina de conteúdo da Trader Nation.
# Mudou aqui, muda o comportamento de todas as rotinas no dia seguinte.

conta:
  instagram: tradernationoficial
  metricool_blog_id: "7382447"            # publicador oficial (Reels, carrosséis, cards, 1º comentário)
  platformAccountId: "29063055853307449"   # vidIQ (OAuth, publicação liberada)
  youtube_channel_id: UC2BLdwIa3Gb1Xw2FUqIp0XA

painel:
  url: https://claude.ai/artifact/D6jTX4W1U2kB3Fp94gTm7r   # fila de aprovação (db: itens, dias, sistema)

modo: ativo             # ensaio | ativo  (o valor vivo fica em sistema/estado no painel)
# Ensaio cancelado pelo Rodrigo em 12/10: publica de verdade a partir de 13/10.

aprovacao: auto_com_veto  # manual | auto_com_veto
# auto_com_veto (decisão do Rodrigo em 12/10): a Produção aprova sozinha o que tiver nota >= 8 e todos os
# checks de compliance ok; o resto fica "pendente" esperando ele. Ele pode rejeitar qualquer item no painel
# até o horário de publicação.
nota_minima_auto: 8

# Escala em degraus (decisão do Rodrigo em 12/10). A fase vigente fica em sistema/estado.fase no painel.
# Só sobe com "sim" do Rodrigo à pergunta do Analista; cai uma fase se o alcance médio por post cair >20% por 7 dias.
fase_atual: 1
escala:
  # 08:00 de segunda a sexta é sempre o card Panorama (modo MORNING, fora desta tabela). O Reel da manhã sai às 10:00.
  # Fase 1 (decisão do Rodrigo em 14/10): 1 Reel + 2 carrosséis — carrossel entregava ~4x mais views que Reel (1.132/897 vs 248/52).
  1: {reels: 1, trial: 0, slides: 2, horarios: ["10:00", "12:00", "19:00"], producao: "05:47", publicador_cron: "50 9,11,18 * * 0-5"}
  2: {reels: 3, trial: 1, slides: 2, horarios: ["10:00", "12:00", "14:00", "17:00", "20:00"], producao: "05:17", publicador_cron: "50 9,11,13,16,19 * * 0-5"}
  3: {reels: 4, trial: 2, slides: 3, horarios: ["10:00", "11:00", "12:00", "14:00", "17:00", "19:00", "21:00"], producao: "04:47", publicador_cron: "50 9,10,11,13,16,18,20 * * 0-5"}
  4: {reels: 4, trial: 2, slides: 4, horarios: ["10:00", "11:00", "12:00", "14:00", "16:00", "17:00", "19:00", "21:00"], producao: "04:17", publicador_cron: "50 9,10,11,13,15,16,18,20 * * 0-5"}
criterio_subir:
  semanas_minimas_na_fase: 1
  alcance_medio_por_post: "estável ou subindo (>= 90% da semana anterior)"
  estoque_minimo_semanas: 3        # a partir da fase 3: vídeo-fonte bruto suficiente para 3 semanas de cortes
  fonte_extra_fase_3: "lives da sala ao vivo (vidiq_channel_videos videoFormat=live) e pautas gravadas do Radar"
criterio_descer: "alcance médio por post < 80% da semana anterior por 7 dias seguidos"
# Itens "trial" saem como TRIAL_REEL no Metricool (só não-seguidores veem; não lotam o feed de quem segue).

estoque_alvo_dias: 3    # manter de 3 a 5 dias de itens aprovados guardados

estilos_reel:           # proporção da skill videos-insta-virais
  raiz: 50              # opinião, polêmica, bastidor, resultado
  jornal: 40            # SÓ macro e notícia; manchete com ângulo "o que muda no WIN/WDO". Mínimo 1 Reel/dia (assunto da semana)
  design: 10            # explicativo, quando o diagrama é a entrega
duracao_reel_max_s: 30   # 14/10: quem fica assiste 4–9 s; cortes de 20–30 s

pilares:                # peso aproximado na semana
  day-trade: 35
  mente: 30
  macro-cripto-ia: 20
  vida: 10
  investir: 5


morning_call:            # card Panorama (decisão do Rodrigo em 13/10), segunda a sexta com pregão
  horario: "08:00"
  rotina: "07:50"         # roda depois do QG1 (7h45, pronto ~7h49)
  fonte: https://claude.ai/artifact/CxZAtEqQPVsvgup1KGrfX1   # painel do QG: dias/<hoje> e historico/<último pregão>
  script: scripts/panorama_carrossel.py   # carrossel de 7 slides (aprovado em 16/10); reserva: scripts/panorama.py (card único)
  fluxo: pendente   # slide 6 só com fonte oficial da B3 confirmada; sem fonte, vira "quanto o mercado anda"
  foto: assets/foto-mc.jpg  # trocar por foto da pasta "TN Fotos" quando existir
  reel_ao_vivo: pendente  # Reel com corte da sala (Mux) 09:50; depende da chave de leitura do Mux

cta:
  link_bio: https://live.tradernation.com.br   # sala ao vivo da TN
  trader360:                                   # 1 post por dia leva a turma no 1º comentário fixado
    ate: 2026-10-20
    url: trader360.tradernation.com.br
    texto: "A turma nova da Trader 360 já começou e dá pra entrar até terça, 20/10. É a fase 5 na prática: alguém de fora olhando os seus trades. trader360.tradernation.com.br"

shabbat:
  pausar: true
  sabado_sem_posts: true
  cidade: São Paulo     # scripts/shabbat.py usa lat/lon de SP; mudar lá se o Rodrigo estiver em outra cidade

proibido:               # o Editor-chefe barra
  - promessa de ganho ("ganhar dinheiro", "garantido", "lucro certo")
  - recomendação de compra/venda de ativo
  - print de resultado sem "Resultado passado não garante resultado futuro."
  - Santander associado a custo alto ou complexidade
  - B3 associada a cassino, jogo ou aposta
  - jargão técnico nos primeiros 5 segundos
  - "ninguém te conta", "a real é", construções "não é X, é Y", tricolons poéticos
  - ataque a pessoa ou concorrente (polêmica é de ideia)

custos:
  vidiq_creditos_dia_max: 300   # corte ~9 créditos/minuto do trecho processado

blob:
  host: https://blob.vercel-storage.com
  publico: https://n3bvomllxviwggf3.public.blob.vercel-storage.com
  pasta: reels/
